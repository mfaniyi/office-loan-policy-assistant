[project]
name = "office-loan-policy-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michael Faniyi", email = "michaelfa@ha-shem.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.156.8",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.5",
]

[project.scripts]
office-loan-policy-assistant = "office_loan_policy_assistant:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
