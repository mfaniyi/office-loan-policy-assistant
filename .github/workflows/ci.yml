name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17

        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: office_loan_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U test_user -d office_loan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: office_loan_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ci_test_secret_not_for_production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: |
           uv python install 3.14
           uv python pin 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Check Python syntax
        run: uv run python -m compileall -q src

      - name: Run backend tests
        run: uv run pytest -q