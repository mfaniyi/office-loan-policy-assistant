# Define the services required by our application
services:

  # PostgreSQL database service
  db:
    image: pgvector/pgvector:pg17
    container_name: office_loan_db
    restart: unless-stopped

    # Configure database credentials for local development
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # Expose PostgreSQL to our local machine
    ports:
      - "127.0.0.1:5433:5432"

    # Preserve database records across container restarts
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: office_loan_api

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      db:
        condition: service_healthy


# Define persistent storage for PostgreSQL
volumes:
  postgres_data: