# Define the services required by our application
services:

  # PostgreSQL database service
  db:
    image: pgvector/pgvector:pg17
    container_name: office_loan_db
    restart: unless-stopped

    # Configure database credentials for local development
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # Expose PostgreSQL to our local machine
    ports:
      - "127.0.0.1:5433:5432"

    # Preserve database records across container restarts
    volumes:
      - postgres_data:/var/lib/postgresql/data

# Define persistent storage for PostgreSQL
volumes:
  postgres_data: